<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CNS Dashboard Login</title>

  <style>
    body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    form { background: #2a2a2a; padding: 2rem; border-radius: 8px; width: min(90vw, 420px); box-shadow: 0 4px 24px rgba(0, 0, 0, .4); }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    textarea { width: 100%; box-sizing: border-box; min-height: 120px; font-family: monospace; padding: .5rem; border-radius: 4px; border: 1px solid #444; background: #111; color: #eee; resize: vertical; }
    button { margin-top: 1rem; width: 100%; padding: .6rem; border: none; border-radius: 4px; background: #4c8bf5; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #3b6fd1; }
    .error { color: #ff6b6b; margin: 0 0 1rem; font-size: .9rem; display: none; }
  </style>
</head>
<body>
  <form method="POST" action="/login">
    <h1>CNS Dashboard Login</h1>
    <p class="error" id="error">Not authorized</p>
    <textarea name="token" placeholder="Paste your dashboard access token" autofocus required></textarea>
    <button type="submit">Log in</button>
  </form>

  <script>
    if (new URLSearchParams(location.search).has('error'))
      document.getElementById('error').style.display = 'block';
  </script>
</body>
</html>
