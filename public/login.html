<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CNS Dashboard Login</title>

  <link rel="stylesheet" href="login.css">
</head>
<body>
  <form method="POST" action="/login">
    <h1>CNS Dashboard Login</h1>
    <p class="error" id="error">Not authorized</p>
    <textarea name="token" placeholder="Paste your dashboard access token" autofocus required></textarea>
    <button type="submit">Log in</button>
  </form>

  <script src="login.js"></script>
</body>
</html>
